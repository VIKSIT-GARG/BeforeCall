# Render Deployment Configuration for BeforeCall
# This file documents the required services and configuration.
# Actual secrets must be set in Render Dashboard, not in this file.

services:
  # Main Next.js Web Service
  - type: web
    name: beforecall
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: beforecall-db
          property: connectionString
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: production
      - key: PRODUCTION_LLM_API_KEY
        sync: false
      - key: PRODUCTION_LLM_MODEL
        value: gpt-4o-mini
      - key: NEXT_PUBLIC_APP_URL
        value: https://beforecall.onrender.com
      - key: AUTH_SECRET
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "60"

  # Background Worker for Research Jobs (optional - enable if research exceeds 30s)
  # - type: worker
  #   name: beforecall-research-worker
  #   runtime: node
  #   plan: starter
  #   buildCommand: npm ci && npm run build
  #   startCommand: npm run worker:start
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: beforecall-db
  #         property: connectionString
  #     - key: TAVILY_API_KEY
  #       sync: false
  #     - key: LLM_PROVIDER
  #       value: production
  #     - key: PRODUCTION_LLM_API_KEY
  #       sync: false
  #     - key: PRODUCTION_LLM_MODEL
  #       value: gpt-4o-mini

databases:
  - name: beforecall-db
    databaseName: beforecall
    user: beforecall_user
    plan: starter
    region: oregon
    postgresMajorVersion: 16